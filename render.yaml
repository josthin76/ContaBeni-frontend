# Render — ContaBeni frontend (SPA React + Vite)
#
# Blueprint de Render (spec: https://render.com/docs/blueprint-spec).
# El Static Site ya existe en el dashboard; este archivo documenta su
# configuración y añade la rewrite SPA que react-router necesita.
#
# ────────────────────────────────────────────────────────────────
# Variables de entorno del Static Site (dashboard → Settings):
#   VITE_API_URL = https://contabily-xcw1.onrender.com/api/v1
#
# Rewrite SPA (obligatorio para react-router): declarada abajo en
# `routes` (spec de Blueprint) — si el sitio fue creado a mano,
# puede añadirse también en Settings → Redirects/Rewrites:
#   Source: /*  Destination: /index.html  Action: Rewrite
#   (¡Rewrite, no Redirect!)
#
# Después, la URL de este sitio va en la variable FRONTEND_URL del
# Web Service del backend (Contabily) — es lo que usa main.ts para el
# CORS. ───────────────────────────────────────────────────────────

services:
  - type: web
    name: contabeni-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Sin esto la app de producción llamaría a /api/v1 sin proxy → 404.
      # En local sí funciona porque vite.config.ts hace de proxy.
      - key: VITE_API_URL
        value: https://contabily-xcw1.onrender.com/api/v1
    routes:
      # react-router maneja las rutas en el navegador; al recargar
      # /login o /compras el servidor debe devolver index.html.
      - type: rewrite
        source: /*
        destination: /index.html
